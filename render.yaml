services:
  - type: web
    name: parques-server
    runtime: python
    buildCommand: cd server && pip install -r requirements.txt
    startCommand: cd server && python -m server.app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parques-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CLAUDE_API_KEY
        sync: false

  - type: web
    name: parques-client
    runtime: static
    buildCommand: cd client && npm install && npx quasar build
    staticPublishPath: client/dist/spa
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_URL
        value: https://parques-server.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://parques-server.onrender.com

databases:
  - name: parques-db
    plan: free
    databaseName: parques
